<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'DejaVu Sans Mono','Courier New',monospace">
  <defs>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35f07a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#35f07a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#35f07a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#000000" fill-opacity="0"/>
      <rect width="3" height="1" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <style>
      text{ fill:#23b45a; }
      .bright{ fill:#35f07a; }
      .amber{ fill:#ffb642; }
      .dim{ fill:#157a3a; }
      .screen{ animation: flick 5s infinite steps(1); }
      @keyframes flick{
        0%,100%{opacity:1} 6%{opacity:.86} 6.5%{opacity:1}
        22%{opacity:.94} 22.5%{opacity:1} 55%{opacity:.9}
        55.4%{opacity:1} 78%{opacity:.96} 78.4%{opacity:1}
      }
      .l{ opacity:0; animation: type .01s linear forwards; }
      .l1{animation-delay:.35s} .l2{animation-delay:.65s}
      .l3{animation-delay:.95s} .l4{animation-delay:1.25s}
      .l5{animation-delay:1.6s}
      @keyframes type{ to{opacity:1} }
      .cur{ animation: blink 1s steps(1) infinite; animation-delay:1.9s; }
      @keyframes blink{ 0%,50%{opacity:1} 51%,100%{opacity:0} }
      @media (prefers-reduced-motion: reduce){
        .screen{animation:none} .cur{animation:none;opacity:1}
        .l{opacity:1;animation:none}
      }
    </style>
  </defs>

  <rect width="820" height="360" fill="#050a06"/>
  <rect x="10" y="10" width="800" height="340" rx="14" fill="#07110a" stroke="#157a3a" stroke-opacity="0.6"/>

  <g class="screen">
    <!-- top status bar -->
    <text x="34" y="46" font-size="13" class="dim">PVL-OS</text>
    <text x="118" y="46" font-size="13" class="dim">TERMINAL v2.6</text>
    <text x="786" y="46" font-size="13" text-anchor="end" class="amber">[ SPbGUT-LINK: ONLINE ]</text>
    <line x1="34" y1="58" x2="786" y2="58" stroke="#157a3a" stroke-opacity="0.5"/>

    <!-- name -->
    <text x="34" y="140" font-size="66" letter-spacing="10" font-weight="bold" class="bright">PAVEL</text>
    <text x="38" y="172" font-size="14" letter-spacing="3">C#/.NET BACKEND // ML PRACTITIONER // ARCH LINUX</text>

    <!-- boot log -->
    <text x="34" y="222" font-size="13" class="l l1">&gt; booting pvl-os<tspan class="dim"> ............... </tspan><tspan class="amber">OK</tspan></text>
    <text x="34" y="244" font-size="13" class="l l2">&gt; mount /home/pavel<tspan class="dim"> ............ </tspan><tspan class="amber">OK</tspan></text>
    <text x="34" y="266" font-size="13" class="l l3">&gt; load dotnet runtime<tspan class="dim"> .......... </tspan><tspan class="amber">OK</tspan></text>
    <text x="34" y="288" font-size="13" class="l l4">&gt; init ml-pipeline<tspan class="dim"> ............. </tspan><tspan class="amber">OK</tspan></text>
    <text x="34" y="310" font-size="13" class="l l5">&gt; ready. awaiting input<tspan class="cur" dx="6">&#9608;</tspan></text>

    <!-- signal equalizer, bottom-right, always rising/falling -->
    <text x="690" y="250" font-size="11" class="dim">SIGNAL</text>
    <g transform="translate(690,320)">
      <rect x="0"  y="-6"  width="7" height="6"  class="bright"><animate attributeName="height" values="6;30;10;24;6" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="-6;-30;-10;-24;-6" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="11" y="-6"  width="7" height="18" class="bright"><animate attributeName="height" values="18;6;28;12;18" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-18;-6;-28;-12;-18" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="22" y="-6"  width="7" height="12" class="bright"><animate attributeName="height" values="12;26;8;30;12" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="-12;-26;-8;-30;-12" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="33" y="-6"  width="7" height="24" class="bright"><animate attributeName="height" values="24;10;20;6;24" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="-24;-10;-20;-6;-24" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="44" y="-6"  width="7" height="8"  class="bright"><animate attributeName="height" values="8;22;14;28;8" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-22;-14;-28;-8" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="55" y="-6"  width="7" height="16" class="bright"><animate attributeName="height" values="16;30;6;18;16" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="-16;-30;-6;-18;-16" dur="1.25s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- scanlines -->
  <rect x="10" y="10" width="800" height="340" rx="14" fill="url(#scan)"/>
  <!-- moving sweep band -->
  <rect x="10" width="800" height="90" fill="url(#sweep)">
    <animate attributeName="y" from="-90" to="360" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <!-- vignette -->
  <rect x="10" y="10" width="800" height="340" rx="14" fill="url(#vig)"/>
</svg>
