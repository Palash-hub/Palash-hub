<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 72" font-family="'DejaVu Sans Mono','Courier New',monospace">
  <defs>
    <style>
      text{ fill:#23b45a; } .bright{fill:#35f07a;} .amber{fill:#ffb642;} .dim{fill:#157a3a;}
      .rec{ animation: bl 1.1s steps(1) infinite; }
      @keyframes bl{ 0%,55%{opacity:1} 56%,100%{opacity:0} }
      @media (prefers-reduced-motion: reduce){ g.roll{animation:none} .rec{animation:none;opacity:1} }
    </style>
    <clipPath id="cp"><rect x="10" y="10" width="800" height="52" rx="10"/></clipPath>
  </defs>

  <rect width="820" height="72" fill="#050a06"/>
  <rect x="10" y="10" width="800" height="52" rx="10" fill="#07110a" stroke="#157a3a" stroke-opacity="0.6"/>

  <g clip-path="url(#cp)">
    <g class="roll">
      <text x="0" y="43" font-size="14">
        <tspan class="amber">CURRENT_OPS //</tspan>
        <tspan class="dim" dx="8">metrics-ingestion service (.NET 10 · Aspire · TimescaleDB)</tspan>
        <tspan dx="16">·</tspan>
        <tspan dx="16">поступление в магистратуру '26</tspan>
        <tspan dx="16">·</tspan>
        <tspan dx="16" class="bright">JMLC 2026 -&gt; AI Talent Hub ИТМО</tspan>
        <tspan dx="16">·</tspan>
        <tspan dx="16">пробтеория &amp; матстат, глава за главой</tspan>
        <tspan dx="16">·</tspan>
      </text>
      <animateTransform attributeName="transform" type="translate" from="820 0" to="-1250 0" dur="22s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="10" y="10" width="150" height="52" rx="10" fill="#07110a"/>
  <circle cx="34" cy="36" r="6" fill="#ff4d4d" class="rec"/>
  <text x="50" y="41" font-size="14" class="amber">REC</text>
  <line x1="150" y1="14" x2="150" y2="58" stroke="#157a3a" stroke-opacity="0.5"/>
</svg>
